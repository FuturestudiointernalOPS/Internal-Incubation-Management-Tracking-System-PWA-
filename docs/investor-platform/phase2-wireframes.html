<!doctype html>
<html lang="fr">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ImpactOS · Investor wireframes</title>
<style>
:root{--accent:#ff6600;--bg:#00002c;--panel:#06063f;--hover:#0d0d58;--line:#1a1a72;--text:#fff;--muted:#a6a6d8;--ok:#2dd4a0;--danger:#ff5470}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,sans-serif}button,input,select{font:inherit;color:inherit}button,select,input{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px 14px;min-height:44px}button{cursor:pointer}button:hover{background:var(--hover)}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button.active,.primary{background:var(--accent);color:var(--text);border-color:var(--accent)}button:disabled{opacity:.5;cursor:default}.review{max-width:1420px;margin:auto;padding:28px}.review h1{font-size:24px;margin:0 0 8px}.muted,small{color:var(--muted)}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}.controls label{display:grid;gap:5px;font-size:12px;color:var(--muted)}#preview{container-type:inline-size;max-width:100%;margin:auto;border:1px solid var(--line);border-radius:18px;overflow:hidden}.app{display:grid;grid-template-columns:205px minmax(0,1fr);min-height:800px;background:var(--bg)}aside{padding:28px 16px;background:var(--panel);border-right:1px solid var(--line)}.brand{font-weight:850;line-height:1.15;letter-spacing:1px;margin-bottom:45px}.brand span{color:var(--accent)}aside button{width:100%;text-align:left;margin:5px 0;background:transparent}.main{min-width:0}.header{display:flex;justify-content:space-between;align-items:center;padding:18px 28px;border-bottom:1px solid var(--line)}.content{padding:28px;display:grid;gap:25px}h2{font-size:25px;line-height:1.2;margin:0 0 10px}h3{font-size:16px;margin:0 0 14px}p{margin:0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.stf-card{padding:22px;border:1px solid var(--line);background:var(--panel);border-radius:16px;min-width:0}.kpi{font-size:30px;font-weight:800;display:block}.actions{display:flex;gap:12px;overflow:auto;padding-bottom:4px}.actions .stf-card{min-width:225px;flex:1;border-left:3px solid var(--accent)}.actions button{margin-top:14px}.tag{font-size:11px;display:inline-flex;border:1px solid var(--line);background:var(--hover);padding:4px 9px;border-radius:20px;margin:6px 0 12px}.venture h3{font-size:19px}.venture button{margin-top:16px}.tabs{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px}.search{display:flex;gap:10px;margin:18px 0}.search input{min-width:0;flex:1}.chart{display:grid;gap:10px}.bar{display:grid;grid-template-columns:110px 1fr 20px;align-items:center;gap:10px;font-size:12px}.bar i{display:block;height:9px;background:var(--accent);border-radius:8px}.notice{padding:16px 20px;border:1px solid var(--line);border-radius:12px;color:var(--muted)}.empty{text-align:center;padding:44px 20px}.empty button{margin-top:18px}.list{display:grid;gap:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:15px}.row button{flex-shrink:0}.skeleton{height:95px;background:var(--hover);border-radius:12px;border:1px solid var(--line)}.bottom{display:none;padding:12px;gap:8px;border-top:1px solid var(--line);background:var(--panel)}.bottom button{flex:1;font-size:12px;padding:9px}details summary{cursor:pointer;min-height:44px;font-weight:700}.planned{font-size:11px;color:var(--muted)}.footer{margin-top:20px;font-size:12px;color:var(--muted)}
.tab-area{order:2}.chart-area{order:1}.content>p,#feedback{order:4}
@container(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.app{grid-template-columns:170px minmax(0,1fr)}.content{padding:20px}.header{padding:16px 20px}}
@container(max-width:600px){.chart-area{order:3}.app{display:block}aside{display:none}.content{padding:18px;gap:20px}.grid{grid-template-columns:1fr}.bottom{display:flex}.header{padding:14px 18px}.header small{display:none}.row{align-items:start;flex-direction:column}.tabs{gap:6px}.tabs button{font-size:12px;padding:8px 10px}.search{flex-direction:column}h2{font-size:23px}}
</style>
<div class="review"><h1 id="heading"></h1><p class="muted" id="intro"></p><div class="controls" id="controls"></div><div id="preview"></div><p class="footer" id="footer"></p></div>
<script>
const labels={
fr:{title:'Espace investisseur · Maquettes à valider',intro:'Référence de discussion pour Christelle FAGBEHOURO. Données fictives, aucune connexion à ImpactOS.',footer:'Validation attendue : ordre des blocs, navigation, cinq onglets et états. Les introductions et rendez-vous représentent les phases 3 et 4 ; ils ne sont pas annoncés comme livrés.',viewport:'Largeur',state:'État',mode:'Visibilité',language:'Langue',ready:'Normal',loading:'Chargement',empty:'Vide',error:'Erreur',partial:'Données partielles',offline:'Hors connexion',pending:'En attente',deal:'Levées de fonds uniquement',full:'Pipeline complet',dashboard:'Tableau de bord',messages:'Messages',profile:'Profil',welcome:'Bonjour Amara, voici tes opportunités',welcomeHint:'Retrouve les entreprises qui correspondent à tes intérêts et les prochaines étapes de tes échanges.',actions:'À suivre',approved:'Introduction approuvée',schedule:'Planifier un rendez-vous',request:'Demande en cours',requestHint:'Future Studio examine ta demande. Tu retrouveras sa décision ici.',see:'Voir le statut',pipeline:'Mon pipeline',invested:'Investissements confirmés',watchlist:'Favoris',recommend:'Entreprises recommandées',discover:'Découvrir',introductions:'Introductions',meetings:'Rendez-vous',planned:'Aperçu · phase suivante',view:'Voir le pitch deck',industry:'Secteur',country:'Pays des fondateurs',benin:'Bénin',fintech:'Services financiers',agri:'Agriculture',energy:'Énergie',raising:'Montant recherché',search:'Rechercher une entreprise',filters:'Filtres',interest:'Je suis intéressé',interested:'Intéressé',diligence:'Analyse en cours',negotiation:'Négociation',chart:'Répartition de mon pipeline',chartHint:'Nombre de tes entreprises par étape. Aucune étape interne du studio.',emptyTitle:'Ton espace commence ici',emptyHint:'Découvre une entreprise, consulte son pitch deck et ajoute-la à tes favoris.',start:'Découvrir les entreprises',errorTitle:'Impossible de charger cette rubrique',errorHint:'Réessaie dans un instant. Tes autres rubriques restent accessibles.',retry:'Réessayer',partialHint:'Les recommandations sont indisponibles. Ton pipeline reste accessible.',offlineHint:'Hors connexion : aperçu des dernières données chargées.',awaiting:'En attente de confirmation par Future Studio',pendingHint:'La déclaration reste séparée des investissements confirmés.',note:'Note privée',noteText:'À revoir après ma prochaine rencontre.',sent:'Demande envoyée',reason:'Refusée · levée de fonds actuellement suspendue',join:'Rejoindre',upcoming:'Prochain rendez-vous',time:'12 novembre · 10:00, Africa/Porto-Novo',stage:'Étape du studio',stageValue:'Validation',stageHint:'L’équipe vérifie son besoin marché.',nda:'NDA : étape désactivée jusqu’à validation juridique',notImplemented:'Aperçu de conception uniquement'},
en:{title:'Investor Space · Wireframes for review',intro:'Discussion reference for Christelle FAGBEHOURO. Synthetic data; no connection to ImpactOS.',footer:'Review requested: block order, navigation, five tabs and states. Introductions and meetings represent Phases 3 and 4; they are not presented as delivered.',viewport:'Width',state:'State',mode:'Visibility',language:'Language',ready:'Normal',loading:'Loading',empty:'Empty',error:'Error',partial:'Partial data',offline:'Offline',pending:'Pending',deal:'Deal flow only',full:'Full pipeline',dashboard:'Dashboard',messages:'Messages',profile:'Profile',welcome:'Hello Amara, here are your opportunities',welcomeHint:'Find ventures matching your interests and the next steps in your conversations.',actions:'Action needed',approved:'Introduction approved',schedule:'Schedule a meeting',request:'Request pending',requestHint:'Future Studio is reviewing your request. Its decision will appear here.',see:'View status',pipeline:'My pipeline',invested:'Confirmed investments',watchlist:'Watchlist',recommend:'Recommended ventures',discover:'Discover',introductions:'Introductions',meetings:'Meetings',planned:'Preview · later phase',view:'View pitch deck',industry:'Industry',country:'Founders’ country',benin:'Benin',fintech:'Financial services',agri:'Agriculture',energy:'Energy',raising:'Amount being raised',search:'Search ventures',filters:'Filters',interest:'I am interested',interested:'Interested',diligence:'Due diligence',negotiation:'Negotiation',chart:'My pipeline by stage',chartHint:'Your ventures per personal stage. No internal studio stage is revealed.',emptyTitle:'Your space starts here',emptyHint:'Discover a venture, review its pitch deck and save it to your watchlist.',start:'Discover ventures',errorTitle:'This section could not be loaded',errorHint:'Try again shortly. Your other sections remain available.',retry:'Retry',partialHint:'Recommendations are unavailable. Your pipeline is still accessible.',offlineHint:'Offline: showing the last loaded snapshot.',awaiting:'Pending confirmation from Future Studio',pendingHint:'This claim remains separate from confirmed investments.',note:'Private note',noteText:'Review after my next meeting.',sent:'Request sent',reason:'Declined · fundraising is currently paused',join:'Join',upcoming:'Next meeting',time:'12 November · 10:00, Africa/Porto-Novo',stage:'Studio stage',stageValue:'Validation',stageHint:'The team is validating its market need.',nda:'NDA: disabled until legal approval',notImplemented:'Design preview only'}};
let lang='fr',tab='discover',state='ready',mode='deal',width='1280';
const t=key=>labels[lang][key]||labels.en[key]||key;
const money=n=>new Intl.NumberFormat(lang,{style:'currency',currency:'XOF',maximumFractionDigits:0}).format(n);
function button(key,action,primary=false){return `<button ${primary?'class="primary"':''} data-action="${action}">${t(key)}</button>`}
function controls(){document.documentElement.lang=lang;document.getElementById('heading').textContent=t('title');document.getElementById('intro').textContent=t('intro');document.getElementById('footer').textContent=t('footer');document.getElementById('controls').innerHTML=[['viewport','width',['360','768','1280'],width],['state','state',['ready','loading','empty','error','partial','offline','pending'],state],['mode','mode',['deal','full'],mode],['language','lang',['fr','en'],lang]].map(([key,id,values,current])=>`<label>${t(key)}<select id="${id}">${values.map(v=>`<option value="${v}" ${v===current?'selected':''}>${id==='width'?v+' px':id==='lang'?v.toUpperCase():t(v)}</option>`).join('')}</select></label>`).join('');}
function ventures(){return `<div class="grid">${[['Kora Pay','fintech'],['Naya Agro','agri'],['Solea','energy']].map(([name,sector])=>`<article class="stf-card venture"><span class="tag">${t(sector)}</span><h3>${name}</h3><p class="muted">${t('country')} : ${t('benin')}</p><p style="margin-top:12px">${t('raising')}<br><strong>${money(25000000)}</strong></p>${mode==='full'?`<p class="muted" style="margin-top:12px">${t('stage')} : ${t('stageValue')}<br><small>${t('stageHint')}</small></p>`:''}${button('view','detail')}</article>`).join('')}</div>`}
function section(){if(state==='loading')return `<div class="grid" aria-busy="true" aria-label="${t('loading')}"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>`;if(state==='empty')return `<div class="stf-card empty"><h3>${t('emptyTitle')}</h3><p class="muted">${t('emptyHint')}</p>${button('start','discover',true)}</div>`;if(state==='error')return `<div class="stf-card empty" role="alert"><h3>${t('errorTitle')}</h3><p class="muted">${t('errorHint')}</p>${button('retry','retry',true)}</div>`;if(tab==='discover')return `<div class="search"><input aria-label="${t('search')}" placeholder="${t('search')}">${button('filters','filters')}</div>${ventures()}`;if(tab==='pipeline')return `<div class="list">${[['Kora Pay','interested'],['Naya Agro','diligence']].map(([name,key])=>`<article class="stf-card row"><div><h3>${name}</h3><span class="tag">${t(key)}</span><p class="muted">${state==='pending'?t('awaiting'):t('pendingHint')}</p></div>${button('see','detail')}</article>`).join('')}</div>`;if(tab==='watchlist')return `<article class="stf-card"><h3>Kora Pay</h3><p class="muted">${t('note')} : ${t('noteText')}</p>${button('interest','pipeline',true)}</article>`;if(tab==='introductions')return `<div class="notice">${t('planned')}</div><div class="list"><article class="stf-card row"><div><h3>Kora Pay</h3><p>${t('sent')}</p></div>${button('see','detail')}</article><article class="stf-card"><h3>Naya Agro</h3><p>${t('reason')}</p></article></div>`;return `<div class="notice">${t('planned')}</div><article class="stf-card row"><div><h3>${t('upcoming')} · Kora Pay</h3><p class="muted">${t('time')}</p></div>${button('join','detail',true)}</article>`;}
function render(){controls();const preview=document.getElementById('preview');preview.style.width=width+'px';preview.innerHTML=`<div class="app"><aside><div class="brand">FUTURE<br>STUDIO<br><span>IMPACTOS</span></div><button class="active">${t('dashboard')}</button><button disabled>${t('messages')} · ${t('planned')}</button><button data-action="profile">${t('profile')}</button></aside><div class="main"><header class="header"><strong>IMPACTOS / ${t('dashboard')}</strong><small>Amara · ${lang.toUpperCase()}</small></header><main class="content"><section><h2>${t('welcome')}</h2><p class="muted">${t('welcomeHint')}</p></section>${state==='offline'?`<div class="notice" role="status">${t('offlineHint')}</div>`:''}<section><h3>${t('actions')}</h3><div class="actions"><article class="stf-card"><strong>${t('approved')}</strong><p class="muted">Kora Pay</p>${button('schedule','meetings',true)}</article><article class="stf-card"><strong>${state==='pending'?t('awaiting'):t('request')}</strong><p class="muted">${t('requestHint')}</p>${button('see','introductions')}</article></div></section><div class="grid">${[['pipeline',4],['invested',1],['watchlist',3]].map(([key,n])=>`<button class="stf-card" data-action="${key==='invested'?'pipeline':key}"><span class="muted">${t(key)}</span><span class="kpi">${state==='empty'?0:n}</span></button>`).join('')}</div><section><h3>${t('recommend')}</h3>${state==='partial'?`<div class="notice" role="status">${t('partialHint')}</div>`:state==='empty'||state==='loading'?'':ventures()}</section><section class="tab-area"><div class="tabs">${['discover','pipeline','watchlist','introductions','meetings'].map(key=>`<button class="${tab===key?'active':''}" data-action="${key}" aria-pressed="${tab===key}">${t(key)}${['introductions','meetings'].includes(key)?' · +':''}</button>`).join('')}</div><div style="margin-top:18px">${section()}</div></section><details class="chart-area"><summary>${t('chart')}</summary><div class="stf-card chart">${[['interested',2,70],['diligence',1,35],['negotiation',1,35]].map(([key,n,pct])=>`<div class="bar"><span>${t(key)}</span><i style="width:${pct}%" aria-hidden="true"></i><strong>${n}</strong></div>`).join('')}<p class="muted">${t('chartHint')}</p></div></details><p class="muted">${t('nda')}</p><div id="feedback" class="notice" role="status" hidden></div></main><nav class="bottom" aria-label="${t('dashboard')}">${button('dashboard','discover')}<button disabled>${t('messages')}</button>${button('profile','profile')}</nav></div></div>`;document.querySelectorAll('select').forEach(el=>el.onchange=()=>{if(el.id==='lang')lang=el.value;if(el.id==='state')state=el.value;if(el.id==='mode')mode=el.value;if(el.id==='width')width=el.value;render()});preview.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>{const action=el.dataset.action;if(['discover','pipeline','watchlist','introductions','meetings'].includes(action)){tab=action;render()}else if(action==='retry'){state='ready';render()}else{const feedback=document.getElementById('feedback');feedback.hidden=false;feedback.textContent=t('notImplemented');feedback.scrollIntoView({block:'nearest',behavior:'smooth'})}})}render();
</script>
</html>
