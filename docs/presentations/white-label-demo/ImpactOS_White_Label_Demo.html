<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src data:; base-uri 'none'; form-action 'none'"><title></title>
<style>
:root{--bg-primary:#00002C;--surface-1:#06063F;--surface-2:#0D0D58;--border-primary:#1A1A72;--text-primary:#FFFFFF;--text-secondary:#A6A6D8;--brand-orange:#FF6600;--accent-end:#FF8433;--success:#2DD4A0;--danger:#FF5470;--transparent:transparent;--radius:16px}
*{box-sizing:border-box}body{margin:0;background:var(--bg-primary);color:var(--text-primary);font:15px/1.6 system-ui,-apple-system,sans-serif}button,select,input{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--brand-orange);outline-offset:4px}button,input,select{color:var(--text-primary)}button{border:1px solid var(--border-primary);background:var(--surface-1);border-radius:12px;padding:10px 16px;font-weight:600}button:hover{background:var(--surface-2)}select,input{background:var(--surface-1);border:1px solid var(--border-primary);border-radius:12px;padding:12px;width:100%;font-size:13px}label,.eyebrow{display:block;font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:8px}.demo-notice{padding:12px 24px;border-bottom:1px solid var(--border-primary);color:var(--text-secondary);font-size:12px}.demo-notice strong{color:var(--brand-orange)}.layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 65px)}aside{background:var(--surface-1);border-right:1px solid var(--border-primary);padding:30px 22px;display:flex;flex-direction:column;gap:30px}.brand{display:flex;gap:12px;align-items:center}.brandmark{font-size:26px;color:var(--brand-orange);font-weight:900}.brand b{font-size:20px;letter-spacing:-.04em}.brand small{display:block;color:var(--text-secondary);font-size:11px;letter-spacing:.12em}.client-mark{border:1px solid var(--border-primary);padding:18px;border-radius:var(--radius)}.client-mark b{display:block;margin:12px 0 4px}.monogram{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--surface-2);color:var(--brand-orange);font-size:20px;font-weight:800}nav{display:grid;gap:8px}nav button{text-align:left;border:0;color:var(--text-secondary)}nav button[aria-current=page]{color:var(--brand-orange);background:linear-gradient(90deg,var(--surface-2),var(--surface-1));box-shadow:inset 3px 0 var(--brand-orange)}.nav-row{display:flex;justify-content:space-between;align-items:center}.tiny{font-size:10px;color:var(--text-secondary)}.aside-footer{margin-top:auto;color:var(--text-secondary);font-size:12px}main{min-width:0;padding:28px 4vw 40px;max-width:1500px;width:100%;margin:auto}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:32px}.toolbar p{font-size:12px;color:var(--text-secondary);margin:0}.controls{display:grid;grid-template-columns:1.4fr 1.4fr 1fr;gap:16px;background:var(--surface-1);border:1px solid var(--border-primary);border-radius:var(--radius);padding:20px;margin-bottom:32px}.hero{padding:10px 0 30px;border-bottom:1px solid var(--border-primary);margin-bottom:28px}.hero h1{font-size:clamp(28px,3.3vw,44px);line-height:1.15;letter-spacing:-.045em;margin:14px 0}.hero p{color:var(--text-secondary);max-width:650px;margin:0}.pill{display:inline-block;border:1px solid var(--border-primary);padding:4px 10px;border-radius:20px;font-size:11px;color:var(--text-secondary)}.pill.accent{color:var(--brand-orange)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:32px}.stf-card{background:var(--surface-1);border:1px solid var(--border-primary);border-radius:var(--radius);padding:24px}.metric strong{font-size:32px;display:block;line-height:1.2}.heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:26px 0 18px}h2{font-size:22px;letter-spacing:-.025em;margin:0}h3{font-size:20px;line-height:1.3;margin:18px 0 12px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.programme{display:flex;flex-direction:column;align-items:flex-start;min-height:280px}.programme p{color:var(--text-secondary);font-size:14px;margin:0 0 22px}.programme button{margin-top:auto}.primary{background:linear-gradient(110deg,var(--brand-orange),var(--accent-end));color:var(--text-primary);border:0}.primary:hover{background:var(--brand-orange)}.metadata{font-size:12px;color:var(--text-secondary);margin-bottom:20px}.empty{padding:50px 28px;text-align:center;border:1px solid var(--border-primary);border-radius:var(--radius);background:var(--surface-1)}.empty p{color:var(--text-secondary);max-width:550px;margin:12px auto}.lock{font-size:30px;color:var(--danger)}.mandate{padding:18px 20px;border:1px solid var(--border-primary);border-radius:var(--radius);margin-bottom:24px}.mandate label{display:flex;align-items:center;gap:12px;letter-spacing:0;text-transform:none;font-size:14px;color:var(--text-primary);margin:0}.mandate input{width:18px;height:18px;accent-color:var(--brand-orange)}.mandate p{font-size:12px;color:var(--text-secondary);margin:8px 0 0}.details{max-width:850px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:30px}.audit{margin-top:28px}.audit p,.audit li{color:var(--text-secondary);font-size:13px}.audit li{padding:12px 0;border-bottom:1px solid var(--border-primary)}.evidence{margin-top:40px;padding-top:24px;border-top:1px solid var(--border-primary)}.evidence-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:18px}.evidence h3{font-size:14px;margin:0 0 8px}.evidence p{font-size:12px;color:var(--text-secondary);margin:0}.ok{color:var(--success)}.accent-text{color:var(--brand-orange)}.page-footer{color:var(--text-secondary);font-size:11px;margin-top:28px}.search{max-width:300px}button:disabled{opacity:.5;cursor:default}
@media(max-width:950px){.layout{grid-template-columns:190px 1fr}aside{padding:24px 14px}.controls{grid-template-columns:1fr}.cards,.evidence-grid{grid-template-columns:1fr}.toolbar{align-items:flex-start}.toolbar button{font-size:11px;padding:8px}.metrics{gap:8px}.metric{padding:16px}.metric strong{font-size:24px}}
@media(max-width:620px){.layout{display:block}aside{border-right:0;border-bottom:1px solid var(--border-primary);gap:16px}.client-mark,.aside-footer{display:none}nav{grid-template-columns:repeat(3,1fr)}nav button{padding:10px;font-size:12px}.nav-row{display:block}main{padding:24px 18px}.toolbar{flex-wrap:wrap}.metrics{grid-template-columns:1fr}.heading{align-items:stretch;flex-direction:column}.search{max-width:none}.detail-grid{grid-template-columns:1fr}.demo-notice{padding:10px 18px}}
@media print{aside,.controls,.toolbar button,.search,button,.mandate{display:none}.layout{display:block}main{max-width:none}.cards,.evidence-grid{break-inside:avoid}body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body><div id="app"></div><script>
const LOCALES={"en": {"title": "White-Label OS · Interactive preview", "brand": "ImpactOS", "offer": "White-Label OS", "demo": "Demonstration · fictional data only", "notice": "This preview illustrates the proposed experience. It does not connect to a database or prove production isolation.", "client": "Client organisation", "alpha": "Horizon Innovation Lab", "beta": "Nova University", "enterprise": "Fictional enterprise", "university": "Fictional university", "space": "Client workspace", "supervision": "Future Studio supervision", "mode": "Viewing as", "programs": "Programmes", "lms": "LMS", "venture": "Venture", "soon": "Coming next", "status": "Access scenario", "active": "Active", "suspended": "Suspended", "welcome": "One workspace. Your programmes.", "subtitle": "A dedicated experience for each organisation, using the existing ImpactOS modules.", "search": "Search programmes", "count": "Programmes in this workspace", "participants": "Illustrative participants", "scope": "Offer scope", "three": "3 modules", "catalogue": "Your programmes", "detail": "View programme", "back": "Back to programmes", "dates": "Programme period", "duration": "Duration", "weeks": "weeks", "description": "About this programme", "a1": "Innovation Accelerator 2026", "a2": "Leadership Lab 2026", "b1": "Entrepreneurship Campus 2026", "a1desc": "A fictional cohort supporting early-stage teams from idea validation to a structured pitch.", "a2desc": "A fictional programme developing leadership and collaboration through guided workshops.", "b1desc": "A fictional university programme helping student founders structure an entrepreneurial project.", "dateA": "2 November – 18 December 2026", "dateB": "9 November – 4 December 2026", "dateC": "2 November – 11 December 2026", "planned": "Planned", "noResults": "No matching programmes. Try another search.", "denied": "Workspace access suspended", "deniedText": "Programme content is hidden in this simulated scenario. Existing records are retained. Contact your organisation administrator.", "mandate": "Simulate a temporary read mandate", "mandateHint": "An internal role alone is not sufficient. This switch simulates an explicit mandate for the selected organisation.", "noMandate": "A read mandate is required", "noMandateText": "Client programmes remain hidden until an explicit, valid mandate is simulated.", "audit": "Simulated consultation log", "auditEmpty": "No simulated consultations yet. Open a programme while using supervision.", "auditEvent": "Programme consulted with a read mandate", "auditBadge": "Simulation only · nothing saved to the server", "evidence": "What has been built?", "built": "Implemented and tested locally", "builtText": "Organisation foundation, scoped programme read services, temporary supervision and consultation audit, additive migration checks.", "preview": "Illustrated here", "previewText": "Client branding, workspace selector, programme cards and access scenarios. These screens use fictional data; they are not connected to the backend.", "remaining": "Before a real client launch", "remainingText": "Complete indirect access checks, connect the client journey, validate the representative environment and obtain launch approval. The full build is not yet validated.", "upcomingText": "This module belongs to the agreed offer. Its client experience is not delivered in this preview. Programmes is the first implementation increment.", "reset": "Reset demo", "language": "Language", "owner": "Prepared for review · Christelle FAGBEHOURO", "progress": "Delivery overview", "close": "Close", "readOnly": "Read-only preview", "orgScope": "Selected organisation only", "mock": "Illustrative content · not a live programme", "english": "English", "french": "French"}, "fr": {"title": "White-Label OS · Démonstration interactive", "brand": "ImpactOS", "offer": "White-Label OS", "demo": "Démonstration · données fictives uniquement", "notice": "Cette démonstration illustre le parcours proposé. Elle ne se connecte à aucune base et ne prouve pas l’isolation en production.", "client": "Organisation cliente", "alpha": "Horizon Innovation Lab", "beta": "Université Nova", "enterprise": "Entreprise fictive", "university": "Université fictive", "space": "Espace client", "supervision": "Supervision Future Studio", "mode": "Mode de consultation", "programs": "Programmes", "lms": "LMS", "venture": "Venture", "soon": "À venir", "status": "Scénario d’accès", "active": "Actif", "suspended": "Suspendu", "welcome": "Un espace dédié. Vos programmes.", "subtitle": "Une expérience propre à chaque organisation, à partir des modules existants d’ImpactOS.", "search": "Rechercher un programme", "count": "Programmes de cet espace", "participants": "Participants illustratifs", "scope": "Périmètre de l’offre", "three": "3 modules", "catalogue": "Vos programmes", "detail": "Voir le programme", "back": "Retour aux programmes", "dates": "Période du programme", "duration": "Durée", "weeks": "semaines", "description": "À propos du programme", "a1": "Accélérateur Innovation 2026", "a2": "Leadership Lab 2026", "b1": "Campus Entrepreneuriat 2026", "a1desc": "Une cohorte fictive accompagnant des équipes de la validation de leur idée à la préparation d’un pitch structuré.", "a2desc": "Un programme fictif pour développer le leadership et la collaboration à travers des ateliers accompagnés.", "b1desc": "Un programme universitaire fictif aidant les étudiants à structurer leur projet entrepreneurial.", "dateA": "2 novembre – 18 décembre 2026", "dateB": "9 novembre – 4 décembre 2026", "dateC": "2 novembre – 11 décembre 2026", "planned": "Planifié", "noResults": "Aucun programme correspondant. Essayez une autre recherche.", "denied": "Accès à l’espace suspendu", "deniedText": "Le contenu des programmes est masqué dans ce scénario simulé. Les données existantes sont conservées. Contactez l’administrateur de votre organisation.", "mandate": "Simuler un mandat temporaire de lecture", "mandateHint": "Un rôle interne ne suffit pas. Ce bouton simule un mandat explicite pour l’organisation sélectionnée.", "noMandate": "Un mandat de lecture est nécessaire", "noMandateText": "Les programmes du client restent masqués tant qu’un mandat explicite et valide n’est pas simulé.", "audit": "Journal simulé des consultations", "auditEmpty": "Aucune consultation simulée. Ouvrez un programme en mode supervision.", "auditEvent": "Programme consulté avec un mandat de lecture", "auditBadge": "Simulation uniquement · aucun enregistrement sur le serveur", "evidence": "Qu’est-ce qui a été réalisé ?", "built": "Implémenté et testé localement", "builtText": "Socle organisations, services de lecture limités au client, supervision temporaire, journalisation et vérification des migrations additives.", "preview": "Illustré ici", "previewText": "Identité client, sélecteur d’espace, fiches programmes et scénarios d’accès. Ces écrans utilisent des données fictives et ne sont pas connectés au backend.", "remaining": "Avant une ouverture à un vrai client", "remainingText": "Terminer les contrôles des accès indirects, connecter le parcours client, valider l’environnement représentatif et obtenir l’accord de lancement. La compilation complète reste à valider.", "upcomingText": "Ce module fait partie de l’offre confirmée. Son parcours client n’est pas livré dans cette démonstration. Programmes est le premier incrément de réalisation.", "reset": "Réinitialiser", "language": "Langue", "owner": "Préparé pour revue · Christelle FAGBEHOURO", "progress": "État d’avancement", "close": "Fermer", "readOnly": "Aperçu en lecture seule", "orgScope": "Organisation sélectionnée uniquement", "mock": "Contenu illustratif · programme non réel", "english": "Anglais", "french": "Français"}};
let lang='fr',org='alpha',mode='client',scenario='active',moduleKey='programs',query='',selected=null,mandate=false,audit=[];
const data={alpha:[{id:'a1',desc:'a1desc',date:'dateA',weeks:7,people:24},{id:'a2',desc:'a2desc',date:'dateB',weeks:4,people:18}],beta:[{id:'b1',desc:'b1desc',date:'dateC',weeks:6,people:30}]};
function t(key){return LOCALES[lang][key]||LOCALES.en[key]||key}
function esc(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function text(key){return esc(t(key))}
function options(values,value){return values.map(([id,key])=>`<option value="${id}" ${id===value?'selected':''}>${text(key)}</option>`).join('')}
function programmes(){return data[org].filter(p=>t(p.id).toLocaleLowerCase().includes(query.toLocaleLowerCase()))}
function content(){
 if(scenario==='suspended')return `<section class="empty" role="status"><div class="lock" aria-hidden="true">⊘</div><h2>${text('denied')}</h2><p>${text('deniedText')}</p></section>`;
 if(mode==='supervision'&&!mandate)return `<section class="empty" role="status"><h2>${text('noMandate')}</h2><p>${text('noMandateText')}</p></section>`;
 if(moduleKey!=='programs')return `<section class="empty"><span class="pill accent">${text('soon')}</span><h2>${text(moduleKey)}</h2><p>${text('upcomingText')}</p></section>`;
 if(selected){const p=data[org].find(p=>p.id===selected);return `<section class="details"><button data-action="back">‹ ${text('back')}</button><article class="stf-card" style="margin-top:20px"><span class="pill">${text('planned')}</span><h2 style="margin-top:18px">${text(p.id)}</h2><p class="metadata">${text('mock')}</p><h3>${text('description')}</h3><p>${text(p.desc)}</p><div class="detail-grid"><div><span class="eyebrow">${text('dates')}</span>${text(p.date)}</div><div><span class="eyebrow">${text('duration')}</span>${p.weeks} ${text('weeks')}</div></div></article></section>`}
 return `<div class="metrics"><div class="stf-card metric"><span class="eyebrow">${text('count')}</span><strong>${data[org].length}</strong></div><div class="stf-card metric"><span class="eyebrow">${text('participants')}</span><strong>${data[org].reduce((sum,p)=>sum+p.people,0)}</strong></div><div class="stf-card metric"><span class="eyebrow">${text('scope')}</span><strong>${text('three')}</strong></div></div><div class="heading"><h2>${text('catalogue')}</h2><input id="search" class="search" type="search" aria-label="${text('search')}" placeholder="${text('search')}" value="${esc(query)}"></div><div class="cards">${programmes().map(p=>`<article class="stf-card programme"><span class="pill">${text('planned')}</span><h3>${text(p.id)}</h3><div class="metadata">${text(p.date)} · ${p.weeks} ${text('weeks')}</div><p>${text(p.desc)}</p><button class="primary" data-program="${p.id}">${text('detail')} →</button></article>`).join('')||`<p role="status">${text('noResults')}</p>`}</div>`;
}
function render(){
 document.documentElement.lang=lang;document.title=t('title');
 document.getElementById('app').innerHTML=`<div class="demo-notice"><strong>${text('demo')}</strong> &nbsp; ${text('notice')}</div><div class="layout"><aside><div class="brand"><span class="brandmark" aria-hidden="true">◈</span><div><b>${text('brand')}</b><small>${text('offer')}</small></div></div><div class="client-mark"><div class="monogram" aria-hidden="true">${org==='alpha'?'H':'N'}</div><b>${text(org)}</b><span class="tiny">${text(org==='alpha'?'enterprise':'university')}</span></div><nav aria-label="${text('scope')}">${['programs','lms','venture'].map(key=>`<button data-module="${key}" ${moduleKey===key?'aria-current="page"':''}><span class="nav-row"><span>${text(key)}</span>${key==='programs'?'':`<span class="tiny">${text('soon')}</span>`}</span></button>`).join('')}</nav><div class="aside-footer">${text('readOnly')}<br>${text('orgScope')}</div></aside><main><header class="toolbar"><p>${text('offer')} / ${text(mode==='client'?'space':'supervision')}</p><div><button id="language" aria-label="${text('language')}">${text(lang==='fr'?'english':'french')}</button> <button id="reset">${text('reset')}</button></div></header><section class="controls"><div><label for="org">${text('client')}</label><select id="org">${options([['alpha','alpha'],['beta','beta']],org)}</select></div><div><label for="mode">${text('mode')}</label><select id="mode">${options([['client','space'],['supervision','supervision']],mode)}</select></div><div><label for="scenario">${text('status')}</label><select id="scenario">${options([['active','active'],['suspended','suspended']],scenario)}</select></div></section><section class="hero"><span class="pill accent">${text(org)}</span><h1>${text(mode==='client'?'welcome':'supervision')}</h1><p>${text('subtitle')}</p></section>${mode==='supervision'?`<div class="mandate"><label><input id="mandate" type="checkbox" ${mandate?'checked':''} ${scenario==='suspended'?'disabled':''}>${text('mandate')}</label><p>${text('mandateHint')}</p></div>`:''}<div id="content">${content()}</div>${mode==='supervision'&&scenario==='active'&&mandate?`<section class="audit stf-card"><h2>${text('audit')}</h2><span class="tiny">${text('auditBadge')}</span>${audit.filter(e=>e.org===org).length?`<ol>${audit.filter(e=>e.org===org).map(e=>`<li>${text('auditEvent')} · ${text(e.program)} · ${esc(e.time)}</li>`).join('')}</ol>`:`<p>${text('auditEmpty')}</p>`}</section>`:''}<section class="evidence"><span class="eyebrow">${text('progress')}</span><h2>${text('evidence')}</h2><div class="evidence-grid"><article><h3 class="ok">${text('built')}</h3><p>${text('builtText')}</p></article><article><h3 class="accent-text">${text('preview')}</h3><p>${text('previewText')}</p></article><article><h3>${text('remaining')}</h3><p>${text('remainingText')}</p></article></div></section><footer class="page-footer">${text('owner')}</footer></main></div>`;
}
document.addEventListener('change',event=>{const {id,value,checked}=event.target;if(id==='org'){org=value;selected=null;query='';mandate=false}if(id==='mode'){mode=value;selected=null;mandate=false}if(id==='scenario'){scenario=value;selected=null;mandate=false}if(id==='mandate'){mandate=checked;selected=null}render()});
document.addEventListener('input',event=>{if(event.target.id!=='search')return;query=event.target.value;render();const input=document.getElementById('search');input.focus();input.setSelectionRange(query.length,query.length)});
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.id==='language')lang=lang==='fr'?'en':'fr';if(button.id==='reset'){org='alpha';mode='client';scenario='active';moduleKey='programs';query='';selected=null;mandate=false;audit=[]}if(button.dataset.module){moduleKey=button.dataset.module;selected=null;query=''}if(button.dataset.action==='back')selected=null;if(button.dataset.program&&scenario==='active'&&(mode==='client'||mandate)){selected=button.dataset.program;if(mode==='supervision')audit.unshift({org,program:selected,time:new Date().toLocaleTimeString(lang,{hour:'2-digit',minute:'2-digit',second:'2-digit'})})}render()});
render();
</script></body></html>
