<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#03031a;--p:#08082b;--p2:#0f0f3a;--ln:#1b1b52;--tx:#e8ebff;--mu:#8d93c4;--or:#ff6600;--bl:#000060;--gr:#2dd4a0;--cy:#5bb8ff;--rd:#ff5470;box-sizing:border-box}
:root[data-t=l]{--bg:#f3f4fb;--p:#fff;--p2:#eef0fa;--ln:#d9dcf0;--tx:#0b0b3a;--mu:#5b6194}
*{box-sizing:inherit}html,body{line-height:1.5}body{margin:0;background:var(--bg);color:var(--tx);font:400 14px Inter,sans-serif;display:flex;min-height:100vh}
code,.mo{font-family:'JetBrains Mono',monospace}button,input,select{font:inherit;color:inherit}button{cursor:pointer}
svg{flex:none}aside{width:256px;flex:none;background:var(--p);border-right:1px solid var(--ln);position:sticky;top:0;height:100vh;display:flex;flex-direction:column}

nav{flex:1;overflow:auto;padding:0 10px}nav h6,.k,th,label.k{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--mu);margin:0}nav h6{padding:14px 8px 6px}

.sub{display:none;margin:2px 0 6px 18px;border-left:1px solid var(--ln)}.sub.op{display:block}.sub .it{font-weight:500;font-size:12.5px;padding:6px 10px}.sub .it.on{background:var(--or);color:#fff}
.bt{border-top:1px solid var(--ln);padding:8px 10px}main{flex:1;min-width:0}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);display:flex;justify-content:space-between;align-items:center;padding:12px 28px;gap:10px}
.bc{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}.bc b{color:var(--tx)}.rt{display:flex;gap:8px;align-items:center}
.ib{width:34px;height:34px;border-radius:9px;border:1px solid var(--ln);background:var(--p);display:grid;place-items:center;position:relative}.ib i{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--or)}
.pw{padding:24px 28px 50px;max-width:1500px}h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0}.sb{color:var(--mu);margin:2px 0 20px;font-size:13px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;gap:7px;align-items:center;background:var(--p2);border:1px solid var(--ln);border-radius:9px;padding:8px 14px;font-weight:600;font-size:13px}.btn.pr{background:var(--or);border-color:var(--or);color:#fff;box-shadow:0 6px 18px #ff660040}.btn.sm{padding:4px 9px;font-size:12px}.btn.rj{color:var(--rd)}.btn.ok{color:var(--gr)}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:16px}.g2{grid-template-columns:2fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
.c{background:var(--p);border:1px solid var(--ln);border-radius:14px;padding:16px}.c h3{margin:0 0 12px;font-size:14px;display:flex;gap:8px;align-items:center}.c h3 svg{color:var(--or)}
.kp .big{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:6px;font-family:'JetBrains Mono',monospace}.kp .k{display:flex;justify-content:space-between}
.hero{border-radius:16px;padding:26px;margin-bottom:16px;background:radial-gradient(120% 140% at 0% 100%,#c9500f 0%,#2a0f55 38%,var(--bl) 75%);border:1px solid var(--ln);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;color:#fff}.hero h2{margin:0;font-size:24px;font-weight:900}.hero p{margin:4px 0 0;opacity:.8}
.tg{display:inline-block;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;background:var(--p2);color:var(--mu)}.tg.g{background:#2dd4a022;color:var(--gr)}.tg.o{background:#ff660022;color:var(--or)}.tg.r{background:#ff547022;color:var(--rd)}
.tabs{display:flex;gap:4px;background:var(--p);padding:4px;border-radius:10px;border:1px solid var(--ln);width:max-content;max-width:100%;overflow:auto}.tabs button{border:0;background:none;padding:6px 14px;border-radius:7px;color:var(--mu);font-weight:600;font-size:13px;white-space:nowrap}.tabs button.on{background:var(--or);color:#fff}
.bar2{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}input,select{background:var(--p);border:1px solid var(--ln);border-radius:9px;padding:9px 12px;font-size:13px;font-weight:500}input[type=text],input:not([type]){flex:1;min-width:180px}
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:14px;background:var(--p)}table{width:100%;border-collapse:collapse;min-width:620px}th{text-align:left;padding:13px 16px}td{padding:12px 16px;border-top:1px solid var(--ln);font-size:13px}tr:hover td{background:var(--p2)}
.av{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--bl);color:#fff;font-weight:800;font-size:11px;margin-right:10px;vertical-align:middle;border:1px solid var(--or)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal b{font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.1em;padding:4px}.cal button{border:0;background:none;border-radius:8px;padding:8px 0;font-weight:600;position:relative}.cal button:hover{background:var(--p2)}.cal .td{background:var(--or);color:#fff}.cal .sl{outline:2px solid var(--cy)}.cal .ev:after{content:"";position:absolute;bottom:3px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--gr)}.cal .td.ev:after{background:#fff}
.tk{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--ln)}.tk:first-of-type{border:0}.tk.dn span{text-decoration:line-through;color:var(--mu)}.tk input{flex:none;min-width:0;width:18px;height:18px;accent-color:var(--or)}.tk .mo{margin-left:auto;font-size:11px;color:var(--mu)}
.bar{height:6px;border-radius:4px;background:var(--p2);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--or),var(--gr))}
.mod{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:9;padding:16px}.mod .c{width:min(460px,100%);display:grid;gap:10px}#toast{position:fixed;bottom:22px;right:22px;background:var(--gr);color:#03241a;padding:11px 18px;border-radius:10px;font-weight:700;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none;z-index:10}#toast.s{opacity:1;transform:none}
.emp{text-align:center;padding:38px;color:var(--mu)}#mb{display:none}
@media(max-width:900px){aside{position:fixed;z-index:8;transform:translateX(-100%);transition:.2s}aside.open{transform:none}#mb{display:grid}.pw{padding:16px}.top{padding:10px 14px}.g2,.g3{grid-template-columns:1fr}}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
/* ===== Calendrier admin (port du CommandCalendar du ZIP 3) — tout est préfixé x- ===== */
.ccard,.ccx{--bg-primary:#0b1020;--surface-1:#131a2e;--surface-2:#1b2440;--surface-3:#232c47;--text-primary:#f2f5fc;--text-secondary:#a7b0c9;--text-tertiary:#7681a0;--border-primary:#232c47;--grid-line:#3b4670;--brand-orange:#ff6600;--brand-blue:#5b8def;--on-brand:#fff;--accent-soft:#2a1709;--accent-ink:#ff9447;--act:#5b8def;--crit:#f87171;--crit-ink:#fca5a5;--done:#34d399;--lav:#c084fc;--wait:#7681a0;--rail:#03050a;font-family:Poppins,"Segoe UI",system-ui,sans-serif;color:var(--text-primary);line-height:1.5;color-scheme:dark}
:root[data-t=l] .ccard,:root[data-t=l] .ccx{--bg-primary:#fff;--surface-1:#eef0f5;--surface-2:#e4e8f0;--surface-3:#dfe3ec;--text-primary:#0b1226;--text-secondary:#4a5570;--text-tertiary:#7c86a2;--border-primary:#dfe3ec;--grid-line:#b4bcd0;--brand-blue:#0047ab;--accent-soft:#fff0e5;--accent-ink:#b84700;--act:#1a5cc8;--crit:#ef4444;--crit-ink:#b91c1c;--done:#10b981;--lav:#a855f7;--wait:#97a0b8;--rail:#070b18;color-scheme:light}
.g2:has(>.ccard){grid-template-columns:minmax(0,1fr)}
.c.ccard{background:var(--surface-1);border:0;border-radius:12px;padding:20px;min-width:0}
.ccard *,.ccx *{box-sizing:border-box}
.ccard button,.ccx button{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;text-align:inherit}
.ccard button:disabled,.ccx button:disabled{cursor:not-allowed}
.x-i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.x-bar1,.x-bar2{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.x-bar1{margin-bottom:10px}.x-bar2{margin-bottom:12px}
.x-rel{position:relative}
.x-fb{display:inline-flex;align-items:center;gap:8px;height:36px;border-radius:12px;border:1px solid var(--border-primary)!important;background:var(--bg-primary)!important;padding:0 12px!important;font-size:13px;font-weight:500}
.x-fb:hover{background:var(--surface-1)!important}.x-fb:disabled{opacity:.45}.x-fb:disabled:hover{background:var(--bg-primary)!important}
.x-dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.x-pl{border-radius:99px;background:var(--surface-1);padding:0 8px;font-size:10.5px;font-weight:600;line-height:18px;color:var(--text-secondary)}
.x-pl.b{background:var(--bg-primary)}
.x-chev{transition:transform .15s}.x-chev.o{transform:rotate(180deg)}
.x-pop{position:absolute;left:0;top:calc(100% + 6px);z-index:40;min-width:220px;border-radius:12px;border:1px solid var(--border-primary);background:var(--bg-primary);padding:6px;box-shadow:0 25px 50px -12px rgba(0,0,0,.5)}
.x-op{display:flex;width:100%;align-items:center;gap:10px;border-radius:8px;padding:8px 10px!important;font-size:13px}
.x-op:hover,.x-op:focus-visible{background:var(--surface-1)!important;outline:0}
.x-op.s{background:var(--surface-1)!important;font-weight:600}
.x-op .x-pl{margin-left:auto}
.x-types{display:flex;flex-wrap:wrap;gap:6px}
.x-tg{display:inline-flex;align-items:center;gap:8px;height:36px;border-radius:12px;border:1px solid var(--border-primary)!important;padding:0 12px!important;font-size:13px;font-weight:500;color:var(--text-tertiary)}
.x-tg:hover{background:var(--surface-1)!important}
.x-tg.on{border-color:var(--grid-line)!important;background:var(--surface-1)!important;color:var(--text-primary)}
.x-tg.m.on{border-color:var(--brand-orange)!important;background:var(--accent-soft)!important;color:var(--accent-ink)}
.x-tg .x-pl{background:var(--bg-primary);color:inherit}
.x-tg .x-dot{background:currentColor}
.x-i14{width:14px;height:14px}
.x-right{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.x-sr{display:flex;height:36px;min-width:0;align-items:center;gap:8px;border-radius:12px;border:1px solid var(--border-primary);background:var(--bg-primary);padding:0 10px}
.x-sr:focus-within{border-color:var(--brand-blue)}
.ccard .x-sr input{width:128px;min-width:0;flex:none;border:0;background:transparent;padding:0;border-radius:0;font-size:13px;outline:0;color:var(--text-primary)}
.x-sr input::placeholder{color:var(--text-tertiary)}
.x-sr input::-webkit-search-cancel-button{display:none}
.x-sr .x-i{color:var(--text-tertiary);width:14px;height:14px}
.x-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:99px;font-weight:600;transition:all .15s}
.x-btn.sm{padding:6px 14px!important;font-size:12px}.x-btn.md{padding:10px 20px!important;font-size:13px}
.x-btn.p{background:var(--brand-orange)!important;color:var(--on-brand)!important}.x-btn.p:hover{filter:brightness(1.1)}
.x-btn.s{background:var(--surface-1)!important;border:1px solid transparent!important;color:var(--text-primary)}.x-btn.s:hover{background:var(--surface-2)!important}
.ccard .x-h3{margin:0 6px 0 0;font-size:18px;font-weight:500;line-height:28px;text-transform:capitalize;display:block}
.x-nb{display:grid;width:32px;height:32px;place-items:center;border-radius:50%}.x-nb:hover{background:var(--surface-1)!important}
.x-today{border-radius:99px;background:var(--surface-1)!important;padding:6px 14px!important;font-size:13px;font-weight:600}.x-today:hover{background:var(--surface-2)!important}
.x-flex1{flex:1}
.x-seg{display:inline-flex;border-radius:12px;background:var(--surface-1);padding:3px}
.x-seg button{border-radius:8px;padding:6px 14px!important;font-size:12.5px;font-weight:500;color:var(--text-secondary)}
.x-seg button:hover{color:var(--text-primary)}
.x-seg button.on{background:var(--bg-primary)!important;font-weight:600;color:var(--text-primary)}
.x-range{white-space:nowrap;border-radius:12px;border:1px solid var(--border-primary);padding:6px 12px;font-size:12.5px;font-weight:500}
.x-tab{font-variant-numeric:tabular-nums}
/* mois */
.x-mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;overflow:hidden;border-radius:12px;border:2px solid var(--grid-line);background:var(--grid-line)}
.x-dh{background:var(--surface-1);padding:8px 0;text-align:center;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text-tertiary)}
.x-dh.t{color:var(--accent-ink)}
.x-cell{display:flex;min-height:78px;min-width:0;cursor:pointer;flex-direction:column;gap:2px;background:var(--bg-primary);padding:4px 4px 6px}
.x-cell:hover{background:var(--surface-1)}
.x-dn{display:grid;height:22px;min-width:24px;place-items:center;align-self:center;border-radius:99px;padding:0 6px!important;font-size:12px;font-weight:500;color:var(--text-primary)}
.x-dn.mu{color:var(--text-tertiary)}.x-dn.t{background:var(--brand-orange)!important;font-weight:600;color:#fff}
.x-items{display:flex;min-width:0;flex-direction:column;gap:1px}
.x-it{position:relative;display:flex;min-width:0;align-items:center;gap:6px;border-radius:6px;padding:2px 24px 2px 6px;font-size:11.5px;line-height:1.25;color:var(--text-primary)}
.x-it.tk:hover{background:var(--surface-2)}
.x-it.mt{background:var(--accent-soft);color:var(--accent-ink)}
.x-it.cx{opacity:.55}
.x-it .x-dot{width:8px;height:8px;background:var(--c)}
.x-it .x-i{width:12px;height:12px}
.x-tt{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.x-tt b,.x-ab b{font-weight:600;font-variant-numeric:tabular-nums}
.x-it .x-tt b{margin-right:6px}
.x-done{color:var(--text-tertiary);text-decoration:line-through}
.x-strike{text-decoration:line-through}
.x-mid{margin:4px 0;height:6px;width:100%;border-radius:99px;background:var(--c)}
.x-more{border-radius:6px;padding:2px 6px!important;text-align:left;font-size:11.5px;font-weight:600;color:var(--text-secondary)}.x-more:hover{background:var(--surface-2)!important}
.x-grp .kb{opacity:0}
.x-grp:hover .kb,.kb:focus-visible,.kb[aria-expanded=true]{opacity:1}
.kb{position:absolute;right:4px;top:4px;display:grid;width:20px;height:20px;place-items:center;border-radius:6px;transition:opacity .15s}
.kb:hover{background:var(--surface-3)!important}
.kb .x-i{width:14px;height:14px}
@media(hover:none){.x-grp .kb{opacity:.8}}
/* semaine / jour */
.x-scroll{max-height:min(400px,58vh);overflow:auto;border-radius:12px;border:2px solid var(--grid-line);background:var(--bg-primary)}
.x-gh{position:sticky;top:0;z-index:6;display:grid;border-bottom:2px solid var(--grid-line);background:var(--surface-1)}
.x-hc{display:flex;flex-direction:column;gap:2px;border-left:2px solid var(--grid-line);padding:6px 4px;align-items:center}
.x-hc.day{align-items:flex-start;padding-left:14px}
.x-hc .wd{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:500;color:var(--text-secondary)}
.x-hc.t .wd{font-weight:600;color:var(--accent-ink)}
.x-hc .dd{display:grid;width:32px;height:32px;place-items:center;border-radius:50%;font-size:16px;font-weight:500;color:var(--text-primary)}
.x-hc button.dd:hover{background:var(--surface-2)!important}
.x-hc.t .dd{background:var(--brand-orange)!important;font-weight:600;color:#fff}
.x-gb{position:relative;display:grid}
.x-hr{position:relative}
.x-hr span{position:absolute;right:8px;font-size:10.5px;color:var(--text-tertiary);font-variant-numeric:tabular-nums}
.x-hr span.nowb{right:4px;z-index:4;transform:translateY(-50%);border-radius:5px;background:var(--crit);padding:0 6px;font-size:10px;font-weight:600;color:#fff}
.x-col{position:relative;border-left:2px solid var(--grid-line);background-image:linear-gradient(var(--grid-line) 2px,transparent 2px);background-size:100% 60px}
.x-ab{position:absolute;border-radius:8px;padding:4px 24px 4px 22px;font-size:11.5px;line-height:1.375;color:var(--text-primary);overflow:hidden}
.x-ab:hover{background:var(--surface-2)}
.x-ab>.x-dot{position:absolute;left:8px;top:9px;width:8px;height:8px;background:var(--c)}
.x-ab.mt{background:var(--accent-soft);padding-left:24px;color:var(--accent-ink);box-shadow:inset 0 0 0 1px rgba(255,102,0,.35)}
.x-ab.mt:hover{background:var(--accent-soft);box-shadow:inset 0 0 0 1px rgba(255,102,0,.6)}
.x-ab.mt>.x-i{position:absolute;left:8px;top:7px;width:12px;height:12px}
.x-ab.cx{opacity:.55}
.x-ab b{white-space:nowrap}.x-ab b.blk{display:block}.x-ab b.mr{margin-right:8px}.x-ab b.mr6{margin-right:6px}
.x-ab .tl{display:block;width:100%;text-align:left}
.x-ab .pl{font-weight:400;opacity:.85}
.x-sh{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.x-nowl:before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--crit)}
.x-none{pointer-events:none;position:absolute;inset:0;z-index:2;display:grid;place-items:center;padding-left:52px;font-size:14px;color:var(--text-tertiary)}
.x-leg{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px 16px;border-top:1px solid var(--border-primary);padding-top:12px}
.x-leg span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary)}
.x-leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* menu ⋯ */
.x-menu{position:fixed;z-index:300;width:200px;border-radius:12px;border:1px solid var(--border-primary);background:var(--bg-primary);padding:6px;box-shadow:0 25px 50px -12px rgba(0,0,0,.5)}
.x-menu p{margin:0;padding:4px 10px 6px;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text-tertiary)}
.x-menu .x-op:disabled{opacity:.4}.x-menu .x-op:disabled:hover{background:transparent!important}
.x-menu .sw{width:10px;height:10px;border-radius:3px;flex:none}
.x-menu .ck{margin-left:auto;color:var(--done)}
/* modale + toast */
.x-ov{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;padding:12px}
.x-bd{position:absolute;inset:0;background:rgba(0,0,0,.7)}
.x-md{position:relative;width:100%;max-width:448px;max-height:85vh;overflow-y:auto;overscroll-behavior:contain;border-radius:22px;border:1px solid var(--border-primary);background:var(--bg-primary);padding:24px;box-shadow:0 25px 50px -12px rgba(0,0,0,.5);animation:xpop .18s ease-out}
@keyframes xpop{from{opacity:0;transform:translateY(20px) scale(.95)}}
@media(prefers-reduced-motion:reduce){.x-md{animation:none}}

function layout(days){

 let hrs=`<div class="x-hr" style="height:${(h1-h0)*ROW}px" aria-hidden="true">`;
 for(let i=0;i<h1-h0;i++){if(showNow&&todayShown&&Math.abs((nowMin/60-h0-i)*ROW)<12)continue;hrs+=`<span style="top:${i*ROW}px;transform:${i===0?'translateY(2px)':'translateY(-50%)'}">${pad(h0+i)}:00</span>`}
 if(showNow&&todayShown)hrs+=`<span class="nowb" style="top:${(nowMin/60-h0)*ROW}px">${hm([C.now.getHours(),C.now.getMinutes()])}</span>`;
 hrs+='</div>';
 let body='';
 columns.forEach(({date,arr})=>{
  body+=`<div class="x-col" data-col="${dkey(date)}" style="height:${(h1-h0)*ROW}px">`;
  arr.forEach(({item,s,e,lane,n:lanes})=>{
   const top=(s/60-h0)*ROW,hh=Math.max((e-s)/60*ROW-2,40);
   const pos=lanes>1?`left:calc(4px + (100% - 10px) * ${lane} / ${lanes});width:calc((100% - 10px) / ${lanes})`:'left:4px;right:6px';
   const range=`${hm(item.a)} – ${hm(item.b)}`;
   if(item.kind==='meeting'){const short=e-s<45;
    body+=`<div class="x-ab mt x-grp${item.cancelled?' cx':''}" data-ev style="top:${top}px;min-height:${short?26:hh}px;${pos}" title="Réunion · ${range} · ${esc(item.title)}${item.place?' · '+esc(item.place):''}${item.cancelled?' (annulée)':''}">${I('video')}<span class="${short?'x-sh':''}${item.cancelled?' x-strike':''}"><b class="${short?'mr6':'blk'}">${short?hm(item.a):range}</b>${esc(item.title)}${item.place&&!short?`<span class="pl"> · ${esc(item.place)}</span>`:''}</span>${kebab(item)}</div>`}
   else body+=`<div class="x-ab x-grp" data-ev style="top:${top}px;min-height:${hh}px;--c:${TC[item.status]};${pos}" title="${esc(item.title)} · ${SL[item.status]}"><i class="x-dot"></i>${titleBtn(item,'tl'+doneCls(item),`<b class="${m==='day'?'mr':'blk'}">${range}</b>${esc(item.title)}`)}${kebab(item)}</div>`});
  if(same(date,C.now)&&showNow)body+=`<div class="x-nowl" style="top:${(nowMin/60-h0)*ROW}px"></div>`;
  body+='</div>'});
 return`<div class="x-scroll"><div style="${m==='week'?'min-width:840px':''}">${head}<div class="x-gb" style="grid-template-columns:${cols}">${hrs}${body}${total===0?'<div class="x-none">Aucun élément sur cette période</div>':''}</div></div></div>`;
}

/* ── rendu principal ── */
function counts(days){const c={all:0,pending:0,in_progress:0,blocked:0,completed:0,carried_over:0};let taskShown=0,meetings=0;
 days.forEach(d=>itemsFor(d).forEach(it=>{if(!qOk(it))return;if(it.kind==='meeting'){meetings++;return}c.all++;c[it.status]++;if(C.fs==='all'||it.status===C.fs)taskShown++}));return{...c,taskShown,meetings}}
const dotFor=s=>s==='all'?'var(--text-secondary)':TC[s],labelFor=s=>s==='all'?'Tout planifié':SL[s];
function render(){
 const el=root();if(!el)return;IDX={};
 const old=el.querySelector('.x-scroll');if(old)C.sc=old.scrollTop;
 const ae=document.activeElement,keepQ=ae&&ae.classList&&ae.classList.contains('x-q'),pos=keepQ?ae.selectionStart:0;
 const m=mode(),days=daysList(),cn=counts(days),off=!C.on.task;
 const first=days[0],last=days[days.length-1];
 const range=m==='day'?fmt(first,{day:'numeric',month:'long',year:'numeric'}):m==='month'?`${MO[first.getMonth()]} ${first.getFullYear()}`:`${fmt(first,{day:'numeric',month:'short'})} – ${fmt(last,{day:'numeric',month:'short',year:'numeric'})}`;
 let h=`<section aria-label="Calendrier"><div class="x-bar1"><div class="x-rel" data-filter><button type="button" class="x-fb"${off?' disabled title="Le filtre de statut ne concerne que les tâches"':''} data-a="filter" aria-haspopup="listbox" aria-expanded="${C.fo}" aria-label="Filtrer par statut"><i class="x-dot" style="background:${dotFor(C.fs)}"></i><span>${labelFor(C.fs)}</span><span class="x-pl">${cn[C.fs]}</span>${I('down','x-i14 x-chev'+(C.fo?' o':''))}</button>`;
 if(C.fo)h+=`<div class="x-pop" role="listbox" aria-label="Filtrer par statut">${['all',...ST].map(s=>`<button type="button" role="option" class="x-op${C.fs===s?' s':''}" aria-selected="${C.fs===s}" data-a="fopt" data-v="${s}"><i class="x-dot" style="background:${dotFor(s)}"></i>${labelFor(s)}<span class="x-pl b">${cn[s]}</span></button>`).join('')}</div>`;
 h+=`</div><div class="x-types" role="group" aria-label="Types d’éléments à afficher"><button type="button" class="x-tg${C.on.task?' on':''}" aria-pressed="${C.on.task}" data-a="type" data-v="task"><i class="x-dot"></i>Tâches<span class="x-pl">${cn.taskShown}</span></button><button type="button" class="x-tg m${C.on.meeting?' on':''}" aria-pressed="${C.on.meeting}" data-a="type" data-v="meeting">${I('video','x-i14')}Réunions<span class="x-pl">${cn.meetings}</span></button></div>
 <div class="x-right"><label class="x-sr">${I('search')}<input type="search" class="x-q" value="${esc(C.q)}" placeholder="Rechercher…" aria-label="Rechercher dans le calendrier"></label><button type="button" class="x-btn p sm" data-a="add">${I('plus')}Ajouter</button></div></div>
 <div class="x-bar2" role="group" aria-label="Navigation du calendrier"><h3 class="x-h3">${MO[C.anchor.getMonth()]} ${C.anchor.getFullYear()}</h3><button type="button" class="x-nb" data-a="prev" aria-label="Précédent">${I('l')}</button><button type="button" class="x-today" data-a="today">Aujourd'hui</button><button type="button" class="x-nb" data-a="next" aria-label="Suivant">${I('r')}</button><span class="x-flex1"></span><div class="x-seg" role="group" aria-label="Type de vue">${[['day','Jour'],['week','Semaine'],['month','Mois']].map(([k,l])=>`<button type="button" class="${m===k?'on':''}" aria-pressed="${m===k}" data-a="mode" data-v="${k}">${l}</button>`).join('')}</div><span class="x-range" aria-label="Période affichée">${range}</span></div>`;
 h+=m==='month'?renderMonth(days):renderWeekDay(days);
 h+=`<div class="x-leg">${ST.map(s=>`<span><i style="background:${TC[s]}"></i>${SL[s]}</span>`).join('')}</div>`;
 if(C.menu){const it=IDX[C.menu.uid];if(it){const isAs=it.src&&it.src.kind==='as',t=isAs?'Devoir':it.kind==='meeting'?'Séance':'Statut du rappel';
  h+=`<div class="x-menu" role="menu" aria-label="${t}" style="top:${C.menu.top}px;left:${C.menu.left}px"><p>${t}</p>${(it.kind==='meeting'||isAs)?`<button type="button" class="x-op" role="menuitem" data-a="cancelm">${isAs?'Ouvrir le devoir':'Voir les détails'}</button>`:ST.map(s=>`<button type="button" class="x-op${it.status===s?' s':''}" role="menuitemradio" aria-checked="${it.status===s}" data-a="status" data-v="${s}"${s==='carried_over'&&it.status==='completed'&&!it.local?' disabled':''}><i class="sw" style="background:${TC[s]}"></i>${SL[s]}${it.status===s?'<span class="ck" aria-hidden="true">✓</span>':''}</button>`).join('')}</div>`}else C.menu=null}
 h+='</section>';
 el.innerHTML=h;
 const sc=el.querySelector('.x-scroll');if(sc&&Math.abs(sc.scrollTop-C.sc)>0)sc.scrollTop=C.sc;
 if(keepQ){const q=el.querySelector('.x-q');q.focus();q.setSelectionRange(pos,pos)}
 if(C.menu){const f=el.querySelector('.x-menu [aria-checked="true"]')||el.querySelector('.x-menu button');if(f)f.focus({preventScroll:true})}
}

/* ── ⋯ menu, statuts, réunions ── */
function closeMenu(refocus){const uid=C.menu&&C.menu.uid;C.menu=null;render();if(refocus&&uid){const b=root().querySelector(`[data-kebab="${CSS.escape(uid)}"]`);if(b)b.focus()}}
function openMenu(btn){const uid=btn.dataset.kebab;if(C.menu&&C.menu.uid===uid){closeMenu(true);return}
 const it=IDX[uid];if(!it)return;const r=btn.getBoundingClientRect(),w=200,h=it.kind==='meeting'?84:250;
 const left=Math.max(8,Math.min(r.right-w,innerWidth-w-8));let top=r.bottom+6;if(top+h>innerHeight-8)top=Math.max(8,r.top-h-6);
 C.fo=false;C.menu={uid,top,left};render()}
function changeStatus(it,status){C.menu=null;if(it.status===status){render();return}
 it.src.status=status;toast(`${it.title} : ${SL[status]}`);if(typeof go==='function')go();else render()}
function toggleMeeting(it){C.menu=null;if(it.src&&it.src.kind==='as'){nav('assign');return}toast(`${it.title} · ${hm(it.a)} – ${hm(it.b)}${it.place?' · '+it.place:''}${it.who?' · '+it.who:''}`);render()}

/* ── toast + formulaire ── */
function toast(msg){C.toast=msg;clearTimeout(C.tt);C.tt=setTimeout(()=>{C.toast='';renderX()},2400);renderX()}
function defaultDate(){const days=daysList();if(mode()==='month')return C.anchor.getFullYear()===C.now.getFullYear()&&C.anchor.getMonth()===C.now.getMonth()?new Date(C.now):new Date(C.anchor.getFullYear(),C.anchor.getMonth(),1);return days.some(d=>same(d,C.now))?new Date(C.now):days[0]}
function openForm(date,h=9,m=0,FT){const eh=Math.min(23,h+1);C.fo=false;C.menu=null;
 C.form={type:FT||(!C.on.task&&C.on.meeting?'meeting':'task'),title:'',date:dkey(date),start:`${pad(h)}:${pad(m)}`,end:`${pad(eh)}:${pad(m)}`,status:'pending',place:'',error:''};render();renderX()}
function syncForm(){const f=C.form,x=getX();if(!f||!x.querySelector('form'))return;const g=n=>{const e=x.querySelector(`[name=${n}]`);return e?e.value:f[n]};
 f.title=g('title');f.date=g('date');f.start=g('start');f.end=g('end');if(f.type==='task')f.status=g('status');else f.place=g('place')}
function renderX(){const x=getX(),f=C.form;let h='';
 if(f){const mt=f.type==='meeting';
  h+=`<div class="x-ov"><div class="x-bd" data-a="closeform"></div><div class="x-md" role="dialog" aria-modal="true" aria-label="${mt?'Nouvelle réunion':'Nouvelle tâche'}"><div class="x-mh"><h2>${mt?'Nouvelle réunion':'Nouvelle tâche'}</h2><button type="button" data-a="closeform" aria-label="Fermer">${I('x')}</button></div>
  <form class="x-form" novalidate><div class="x-seg2" role="group" aria-label="Type">${[['task','Tâche'],['meeting','Réunion']].map(([k,l])=>`<button type="button" class="${f.type===k?'on':''}${k==='meeting'?' m':''}" aria-pressed="${f.type===k}" data-a="ftype" data-v="${k}">${l}</button>`).join('')}</div>
  <p class="sub">${mt?'Elle apparaît dans le calendrier, sans modifier les compteurs de tâches.':'Elle apparaît tout de suite dans le calendrier.'}</p>
  <div class="x-fld"><label>Titre</label><input name="title" maxlength="60" autocomplete="off" value="${esc(f.title)}" placeholder="${mt?'Ex. Point avec l’équipe':'Ex. Préparer le point du lundi'}"></div>
  <div class="x-fld"><label>Date</label><input name="date" type="date" value="${f.date}"></div>
  <div class="x-two"><div class="x-fld"><label>Début</label><input name="start" type="time" step="900" value="${f.start}"></div><div class="x-fld"><label>Fin</label><input name="end" type="time" step="900" value="${f.end}"></div></div>
  ${mt?`<div class="x-fld"><label>Lieu ou lien</label><input name="place" maxlength="80" autocomplete="off" value="${esc(f.place)}" placeholder="Ex. Visio, salle de réunion"></div>`:`<div class="x-fld"><label>Statut</label><div class="w"><select name="status">${ST.map(s=>`<option value="${s}"${f.status===s?' selected':''}>${SL[s]}</option>`).join('')}</select><span class="ch">${I('down')}</span></div></div>`}
  ${f.error?`<p class="x-err" role="alert">${f.error}</p>`:''}
  <p class="x-note">Non enregistré : cela reste dans ce navigateur jusqu’à ce que vous quittiez la page.</p>
  <div class="x-foot"><button type="button" class="x-btn md s" data-a="closeform">Annuler</button><button type="submit" class="x-btn md p">${mt?'Ajouter la réunion':'Ajouter la tâche'}</button></div></form></div></div>`}
 if(C.toast)h+=`<div class="x-toast" role="status">${esc(C.toast)}</div>`;
 x.innerHTML=h}
function submitForm(){syncForm();const f=C.form,mt=f.type==='meeting';
 const fail=m=>{f.error=m;renderX()};const title=f.title.trim();
 if(!title)return fail(mt?'Donne un titre à la réunion.':'Donne un titre à la tâche.');if(!f.date)return fail('Choisis une date.');if(!f.start||!f.end)return fail('Renseigne l’heure de début et de fin.');
 const a=f.start.split(':').map(Number),b=f.end.split(':').map(Number);if(mins(b)<=mins(a))return fail('L’heure de fin doit être après l’heure de début.');
 const[y,mo,d]=f.date.split('-').map(Number),date=new Date(y,mo-1,d);C.seq++;
 if(mt)S.MT.push({id:++S.seq,kind:'perso',title,date:dkey(date),time:f.start,end:f.end,place:f.place.trim()||'—',who:'Moi'});else S.TK.push({id:++S.seq,title,date:dkey(date),time:f.start,end:f.end,status:f.status});
 const hidden=!C.on[f.type];if(hidden)C.on[f.type]=true;C.fs='all';C.anchor=date;C.sc=30;C.form=null;
 const msg=`${mt?'Réunion ajoutée':'Tâche ajoutée'} le ${longDate(date)} à ${f.start}${hidden?` · ${mt?'réunions de nouveau affichées':'tâches de nouveau affichées'}`:''}`;
 if(typeof go==='function')go();else render();toast(msg)}

/* ── événements ── */
function onClick(e){const t=e.target;
 const kb=t.closest('[data-kebab]');if(kb){e.stopPropagation();openMenu(kb);return}
 const tk=t.closest('[data-task]');if(tk){e.stopPropagation();const tid=tk.dataset.task,tkk=S.TK.find(x=>String(x.id)===tid);toast(tkk?`${tkk.title} · ${tkk.time}`:'Devoir à rendre : voir la page Devoirs');return}
 const a=t.closest('[data-a]');
 if(a){const v=a.dataset.v,k=a.dataset.a;
  if(k==='filter'){C.menu=null;C.fo=!C.fo;render()}
  else if(k==='fopt'){C.fs=v;C.fo=false;render()}
  else if(k==='type'){const o=v==='task'?'meeting':'task';C.on[v]=!C.on[v];if(!C.on.task&&!C.on.meeting)C.on[o]=true;render()}
  else if(k==='add')openForm(defaultDate());
  else if(k==='prev'||k==='next'){const dir=k==='prev'?-1:1,A=C.anchor;C.anchor=mode()==='month'?new Date(A.getFullYear(),A.getMonth()+dir,1):new Date(A.getFullYear(),A.getMonth(),A.getDate()+dir*(mode()==='week'?7:1));C.sc=30;render()}
  else if(k==='today'){C.anchor=new Date();C.sc=30;render()}
  else if(k==='mode'){C.mode=v;C.sc=30;C.menu=null;render()}
  else if(k==='day'){C.anchor=new Date(a.dataset.d+'T00:00:00');C.mode='day';C.sc=30;render()}
  else if(k==='status'){changeStatus(IDX[C.menu.uid],v)}
  else if(k==='cancelm'){toggleMeeting(IDX[C.menu.uid])}
  return}
 const cell=t.closest('[data-cell]');if(cell&&!t.closest('[data-ev]')){C.anchor=new Date(cell.dataset.cell+'T00:00:00');C.mode='day';C.sc=30;render();return}
 const col=t.closest('[data-col]');if(col&&!t.closest('[data-ev]')){const r=col.getBoundingClientRect(),at=Math.floor(((e.clientY-r.top)/ROW*60)/30)*30+C.h0*60,cl=Math.max(0,Math.min(23*60,at));openForm(new Date(col.dataset.col+'T00:00:00'),Math.floor(cl/60),cl%60)}
}
function mount(){const el=root();if(!el||el._m)return;el._m=1;
 el.addEventListener('click',onClick);
 el.addEventListener('input',e=>{if(e.target.classList.contains('x-q')){C.q=e.target.value;render()}});
 el.addEventListener('scroll',e=>{if(e.target.classList&&e.target.classList.contains('x-scroll'))C.sc=e.target.scrollTop},true);
 el.addEventListener('keydown',e=>{const m=el.querySelector('.x-menu');
  if(m&&m.contains(document.activeElement)){const its=[...m.querySelectorAll('button:not(:disabled)')],i=its.indexOf(document.activeElement);
   if(e.key==='ArrowDown'){e.preventDefault();its[(i+1)%its.length].focus()}else if(e.key==='ArrowUp'){e.preventDefault();its[(i-1+its.length)%its.length].focus()}else if(e.key==='Escape'){e.stopPropagation();closeMenu(true)}else if(e.key==='Tab')closeMenu(true)}
  else if(C.fo&&e.key==='Escape'){C.fo=false;render();const b=el.querySelector('.x-fb');if(b)b.focus()}
  else if(C.fo&&(e.key==='ArrowDown'||e.key==='ArrowUp')&&el.querySelector('.x-pop')){const its=[...el.querySelectorAll('.x-pop button')],i=its.indexOf(document.activeElement);e.preventDefault();its[(i+(e.key==='ArrowDown'?1:-1)+its.length)%its.length].focus()}});
 render()}
/* écouteurs globaux (une seule fois) */
const gx=getX();
gx.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;const k=a.dataset.a;
 if(k==='closeform'){C.form=null;renderX()}else if(k==='ftype'){syncForm();C.form.type=a.dataset.v;C.form.error='';renderX()}});
gx.addEventListener('submit',e=>{e.preventDefault();submitForm()});
document.addEventListener('mousedown',e=>{const el=root();if(!el)return;let d=0;
 if(C.fo&&!e.target.closest('[data-filter]')){C.fo=false;d=1}
 if(C.menu&&!e.target.closest('.x-menu')&&!e.target.closest('[data-kebab]')){C.menu=null;d=1}
 if(d)render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&C.form){C.form=null;renderX()}});
addEventListener('scroll',e=>{if(C.menu&&!(e.target.closest&&e.target.closest('.x-menu'))){C.menu=null;render()}},true);
addEventListener('resize',()=>{if(C.menu){C.menu=null}if(C.mode===null)render()});
setInterval(()=>{C.now=new Date();render()},60000);
/* la page recrée tout son contenu à chaque go() : on remonte le calendrier ensuite */
const _go=go;go=function(k){_go(k);mount()};
mount();
window.calAdd=t=>openForm(defaultDate(),9,0,t);
})();

go();
</script></body></html>
